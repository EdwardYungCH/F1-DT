<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-label="輸入、處理、輸出"><title>輸入、處理、輸出</title><defs><marker id="ipg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f9d55"/></marker><marker id="ipr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d63a3a"/></marker><marker id="ipk" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2b3d52"/></marker><marker id="ipb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1e6fd9"/></marker><marker id="ipo" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e08600"/></marker><marker id="ipm" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5f6f82"/></marker></defs><rect width="760" height="250" rx="16" fill="#f6f8fb"/><rect x="30" y="40" width="200" height="120" rx="18" fill="#e8f4ff" stroke="#1e6fd9" stroke-width="3"/><text x="130" y="82" font-size="20" fill="#1e6fd9" text-anchor="middle" font-weight="800" font-family="Noto Sans TC,PingFang HK,Microsoft JhengHei,sans-serif" >輸入 Input</text><text x="130" y="112" font-size="15" fill="#2b3d52" text-anchor="middle" font-weight="700" font-family="Noto Sans TC,PingFang HK,Microsoft JhengHei,sans-serif" >感應器（Sensor）</text><text x="130" y="136" font-size="13" fill="#5f6f82" text-anchor="middle" font-weight="500" font-family="Noto Sans TC,PingFang HK,Microsoft JhengHei,sans-serif" >收集環境資料</text><rect x="280" y="40" width="200" height="120" rx="18" fill="#fff1e0" stroke="#e08600" stroke-width="3"/><text x="380" y="82" font-size="20" fill="#e08600" text-anchor="middle" font-weight="800" font-family="Noto Sans TC,PingFang HK,Microsoft JhengHei,sans-serif" >處理 Process</text><text x="380" y="112" font-size="15" fill="#2b3d52" text-anchor="middle" font-weight="700" font-family="Noto Sans TC,PingFang HK,Microsoft JhengHei,sans-serif" >控制器＋程式</text><text x="380" y="136" font-size="13" fill="#5f6f82" text-anchor="middle" font-weight="500" font-family="Noto Sans TC,PingFang HK,Microsoft JhengHei,sans-serif" >依程式作決定</text><rect x="530" y="40" width="200" height="120" rx="18" fill="#e9f8ee" stroke="#1f9d55" stroke-width="3"/><text x="630" y="82" font-size="20" fill="#1f9d55" text-anchor="middle" font-weight="800" font-family="Noto Sans TC,PingFang HK,Microsoft JhengHei,sans-serif" >輸出 Output</text><text x="630" y="112" font-size="15" fill="#2b3d52" text-anchor="middle" font-weight="700" font-family="Noto Sans TC,PingFang HK,Microsoft JhengHei,sans-serif" >驅動器（Actuator）</text><text x="630" y="136" font-size="13" fill="#5f6f82" text-anchor="middle" font-weight="500" font-family="Noto Sans TC,PingFang HK,Microsoft JhengHei,sans-serif" >做出動作</text><line x1="234" y1="100" x2="272" y2="100" stroke="#2b3d52" stroke-width="4" marker-end="url(#ipk)"/><line x1="484" y1="100" x2="522" y2="100" stroke="#2b3d52" stroke-width="4" marker-end="url(#ipk)"/><path d="M630 164 V206 H130 V170" fill="none" stroke="#5f6f82" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ipm)"/><text x="380" y="228" font-size="14" fill="#5f6f82" text-anchor="middle" font-weight="600" font-family="Noto Sans TC,PingFang HK,Microsoft JhengHei,sans-serif" >動作改變了環境 → 感應器再讀一次（不停重複）</text></svg>